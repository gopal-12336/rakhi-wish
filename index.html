<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>शुभ रक्षाबंधन ❤️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,"Noto Sans Devanagari",sans-serif;min-height:100vh;text-align:center;color:#641a3b;background:linear-gradient(135deg,#fff0f6,#ffe6c9,#fff9df);padding:20px 12px}
.wrap{max-width:650px;margin:auto}
h1{font-size:40px;color:#b21f50;margin:12px 0}
.sub{line-height:1.6;color:#7b4058;margin-bottom:20px}
.box{background:#fff;padding:22px;border-radius:22px;box-shadow:0 10px 35px #8b315020}
input,select{width:100%;padding:14px;margin:8px 0 12px;border:2px solid #efd1dc;border-radius:12px;font-size:16px}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer}
.main{background:linear-gradient(135deg,#c92862,#ed7544);color:white}
.green{background:#25d366;color:white}
.blue{background:#5b4bc4;color:white}
.gold{background:#e5ae32;color:#4b2b00}
.photo-label{display:block;background:#fff4f7;border:2px dashed #d94c7c;padding:14px;border-radius:12px;cursor:pointer;margin:8px 0 12px;font-weight:bold}
#photoInput{display:none}
.designs{display:flex;gap:7px;margin:8px 0;flex-wrap:wrap}
.designs button{flex:1;min-width:100px;margin:0;padding:10px;font-size:13px;background:#f4e5ea;color:#641a3b}
.result{display:none;margin-top:25px}
.frame{padding:10px;border-radius:24px;background:linear-gradient(135deg,#b77a16,#fff0a0,#d39a28,#fff0a0,#b77a16);box-shadow:0 15px 40px #63243b35}
.inner{background:#fffdf1;border:3px solid #9d6818;border-radius:17px;padding:25px 18px}
.title{font-size:29px;color:#a51f50;margin:12px}
.name{font-size:24px;font-weight:bold;color:#74183f;margin:15px}
.photo{width:160px;height:160px;object-fit:cover;border-radius:50%;border:6px solid #d39a28;display:none;margin:15px auto}
.wish{white-space:pre-line;line-height:1.8;font-size:17px;color:#593444}
.sign{margin-top:18px;font-weight:bold;color:#8c3d5c}
.small{font-size:14px;margin-top:20px;color:#89556b}
.loading{display:none;margin-top:12px;color:#8c3d5c}

/* DESIGN 2 */
.d2 .frame{background:linear-gradient(135deg,#8b1e3f,#f7b2c4,#8b1e3f)}
.d2 .inner{background:#fff5f8;border-color:#8b1e3f}
.d2 .title{color:#8b1e3f}

/* DESIGN 3 */
.d3 .frame{background:linear-gradient(135deg,#d47b00,#ffe49a,#d47b00)}
.d3 .inner{background:#fff9e8;border-color:#c47700}
.d3 .title{color:#c47700}

/* DESIGN 4 */
.d4 .frame{background:linear-gradient(135deg,#6138a8,#d8c4ff,#6138a8)}
.d4 .inner{background:#faf7ff;border-color:#6138a8}
.d4 .title{color:#6138a8}

/* DESIGN 5 */
.d5 .frame{background:linear-gradient(135deg,#087f73,#b8eee7,#087f73)}
.d5 .inner{background:#f3fffd;border-color:#087f73}
.d5 .title{color:#087f73}

@media(max-width:500px){
h1{font-size:34px}.title{font-size:26px}.name{font-size:22px}.wish{font-size:16px}
}
</style>
</head>

<body>
<div class="wrap">

<div style="font-size:55px">🎀</div>
<h1>शुभ रक्षाबंधन ❤️</h1>
<p class="sub">अपने भाई या बहन के लिए<br>अपनी पसंद का खूबसूरत कार्ड बनाएं ✨</p>

<div class="box">

<input id="from" placeholder="आपका नाम">
<input id="to" placeholder="भाई / बहन का नाम">

<select id="relation">
<option value="brother">भाई ❤️</option>
<option value="sister">बहन ❤️</option>
</select>

<label class="photo-label">
📸 फोटो चुनें
<input id="photoInput" type="file" accept="image/*">
</label>

<p style="font-weight:bold;margin:8px">🎨 Card Design चुनें</p>

<div class="designs">
<button onclick="setDesign(1)">🌸 Classic</button>
<button onclick="setDesign(2)">🌹 Pink</button>
<button onclick="setDesign(3)">👑 Golden</button>
<button onclick="setDesign(4)">💜 Royal</button>
<button onclick="setDesign(5)">🌿 Teal</button>
</div>

<button class="main" onclick="makeWish()">✨ शुभकामना बनाएं</button>
</div>

<div class="result" id="result">

<div id="cardWrap">
<div class="frame" id="card">
<div class="inner">

<div>🪔 शुभ रक्षाबंधन 🪔</div>
<div class="title">🎀 राखी की शुभकामनाएं 🎀</div>
<div class="name" id="name"></div>

<img id="photo" class="photo">

<div class="wish" id="wish"></div>

<div class="sign" id="sign"></div>

<div style="font-size:25px;margin-top:18px">🌸 🪢 🌸</div>

</div>
</div>
</div>

<button class="green" onclick="share()">📲 WhatsApp पर शेयर करें</button>
<button class="gold" onclick="newWish()">🔄 नई शुभकामना</button>
<button class="blue" onclick="copyWish()">📋 कॉपी करें</button>
<button class="gold" onclick="downloadCard()">🖼️ कार्ड डाउनलोड करें</button>

<div class="loading" id="loading">⏳ कार्ड तैयार हो रहा है...</div>
</div>

<p class="small">
अपने भाई या बहन को यह खूबसूरत कार्ड भेजें ❤️<br><br>
Made with ❤️ for Raksha Bandhan
</p>

</div>

<script>

const brother=[
`भाई, इस रक्षाबंधन पर मेरी यही दुआ है कि तुम्हारी जिंदगी हमेशा खुशियों से भरी रहे।

तुम हमेशा मुस्कुराते रहो और अपने हर सपने को पूरा करो। ❤️`,
`प्यारे भाई, बचपन की शरारतों से लेकर आज तक हमारा रिश्ता हमेशा खास रहा है।

ईश्वर तुम्हें जीवन की हर खुशी दे।

शुभ रक्षाबंधन! 🎀`,
`कभी लड़ाई, कभी मजाक और कभी प्यार...

इन्हीं यादों से हमारा रिश्ता इतना खूबसूरत है।

मेरे प्यारे भाई को रक्षाबंधन की ढेर सारी शुभकामनाएं। ❤️`,
`इस राखी पर तुम्हारी कलाई पर सिर्फ धागा नहीं, बल्कि मेरी ढेर सारी शुभकामनाएं बंधी हैं।

हमेशा खुश रहो भाई। 🌸`
];

const sister=[
`प्यारी बहन, इस रक्षाबंधन पर मेरी यही दुआ है कि तुम्हारी जिंदगी हमेशा खुशियों से भरी रहे।

तुम हमेशा मुस्कुराती रहो। ❤️`,
`तुम सिर्फ मेरी बहन नहीं, मेरी सबसे अच्छी दोस्त भी हो।

तुम्हारे साथ बिताया हर पल मेरे लिए खास है।

शुभ रक्षाबंधन! 🌸`,
`हमारी छोटी-छोटी लड़ाइयां, मस्ती और यादें ही हमारे रिश्ते को खास बनाती हैं।

मेरी प्यारी बहन को रक्षाबंधन की बहुत सारी शुभकामनाएं। 🎀`,
`ईश्वर तुम्हारे हर सपने को पूरा करे और तुम्हें जिंदगी की हर खुशी मिले।

मेरी प्यारी बहन को शुभ रक्षाबंधन! ❤️`
];

let current="";
let last=-1;
let design=1;

function setDesign(n){
design=n;
alert("Design "+n+" चुना गया ❤️");
if(document.getElementById("result").style.display==="block"){
applyDesign();
}
}

function applyDesign(){
let card=document.getElementById("card");
card.className="frame";
if(design>1) card.classList.add("d"+design);
}

function makeWish(){
let from=document.getElementById("from").value.trim();
let to=document.getElementById("to").value.trim();
let relation=document.getElementById("relation").value;

if(!from||!to){
alert("कृपया दोनों नाम लिखें ❤️");
return;
}

showWish(from,to,relation);
updateURL(from,to,relation);
}

function showWish(from,to,relation){

let arr=relation==="brother"?brother:sister;
let i;

do{i=Math.floor(Math.random()*arr.length)}
while(arr.length>1&&i===last);

last=i;
current=arr[i];

document.getElementById("name").innerText="प्रिय "+to+" ❤️";
document.getElementById("wish").innerText=current;
document.getElementById("sign").innerText="प्यार सहित — "+from+" ❤️";

document.getElementById("result").style.display="block";

applyDesign();

document.getElementById("result").scrollIntoView({behavior:"smooth"});
}

function updateURL(from,to,relation){
history.replaceState(null,"",
location.pathname+
"?from="+encodeURIComponent(from)+
"&to="+encodeURIComponent(to)+
"&r="+encodeURIComponent(relation)+
"&d="+design);
}

function newWish(){
let from=document.getElementById("from").value.trim();
let to=document.getElementById("to").value.trim();
let relation=document.getElementById("relation").value;

if(!from||!to)return;

showWish(from,to,relation);
updateURL(from,to,relation);
}

function share(){

let to=document.getElementById("to").value.trim();
let link=location.href;

let text=
`🎀 शुभ रक्षाबंधन 🎀

प्रिय ${to} ❤️

आपके लिए एक खास Rakhi Card बनाया गया है।

👇 अपना कार्ड देखने के लिए link खोलें:

${link}

❤️ शुभ रक्षाबंधन ❤️`;

window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank");
}

function copyWish(){

let from=document.getElementById("from").value.trim();
let to=document.getElementById("to").value.trim();

navigator.clipboard.writeText(
`🎀 शुभ रक्षाबंधन 🎀

प्रिय ${to} ❤️

${current}

प्यार सहित —
${from} ❤️`
).then(()=>alert("Wish कॉपी हो गई ❤️"));
}

document.getElementById("photoInput").addEventListener("change",function(){

const file=this.files[0];
if(!file)return;

const reader=new FileReader();

reader.onload=function(e){
const img=document.getElementById("photo");
img.src=e.target.result;
img.style.display="block";
};

reader.readAsDataURL(file);
});

function downloadCard(){

const card=document.getElementById("card");
const loading=document.getElementById("loading");

loading.style.display="block";

function capture(){

html2canvas(card,{
scale:2,
backgroundColor:"#fffdf1",
useCORS:true
}).then(function(canvas){

let link=document.createElement("a");
link.download="Raksha-Bandhan-Card.png";
link.href=canvas.toDataURL("image/png");
link.click();

loading.style.display="none";
});
}

if(typeof html2canvas==="undefined"){

let script=document.createElement("script");

script.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";

script.onload=capture;

script.onerror=function(){
loading.style.display="none";
alert("Download नहीं हो पाया।");
};

document.body.appendChild(script);

}else{
capture();
}
}

function loadFromLink(){

let p=new URLSearchParams(location.search);

let from=p.get("from");
let to=p.get("to");
let r=p.get("r");
let d=parseInt(p.get("d"));

if(d>=1&&d<=5)design=d;

if(from&&to){

document.getElementById("from").value=from;

document.getElementById("to").value=to;
document.getElementById("relation").value=r||"brother";

showWish(from,to,r||"brother");
}
}

loadFromLink();

</script>
</body>
</html>
