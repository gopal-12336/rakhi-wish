<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>शुभ रक्षाबंधन ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:"Noto Sans Devanagari","Mangal",Arial,sans-serif;
    background:
        radial-gradient(circle at top,#fff9df 0%,transparent 35%),
        linear-gradient(135deg,#fff0f5,#ffe4c4,#fff8df);
    color:#651a3b;
    overflow-x:hidden;
}

/* Floating decoration */

.floating{
    position:fixed;
    bottom:-50px;
    font-size:25px;
    pointer-events:none;
    animation:floatUp linear forwards;
    z-index:1;
}

@keyframes floatUp{
    0%{
        transform:translateY(0) rotate(0deg);
        opacity:0;
    }

    15%{
        opacity:1;
    }

    100%{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}

/* Main */

.container{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:25px 15px 45px;
    text-align:center;
    position:relative;
    z-index:2;
}

.badge{
    display:inline-block;
    background:#ffffff;
    padding:8px 18px;
    border-radius:30px;
    font-size:14px;
    box-shadow:0 5px 20px rgba(100,20,50,.10);
    margin-bottom:15px;
}

.rakhi-icon{
    font-size:75px;
    margin:5px 0 10px;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.1);
    }
}

h1{
    font-size:42px;
    margin-bottom:8px;
    background:linear-gradient(90deg,#a7194b,#e66b37);
    -webkit-background-clip:text;
    color:transparent;
}

.subtitle{
    font-size:17px;
    line-height:1.7;
    color:#7b4058;
    margin-bottom:25px;
}

/* Input Card */

.input-card{
    background:rgba(255,255,255,.90);
    padding:25px 20px;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(120,30,70,.13);
    border:1px solid rgba(255,255,255,.8);
}

label{
    display:block;
    text-align:right;
    font-weight:bold;
    margin:14px 0 7px;
}

input,
select{
    width:100%;
    padding:14px;
    border:2px solid #f0d1dc;
    border-radius:13px;
    outline:none;
    font-size:16px;
    background:#fff;
    font-family:inherit;
}

input:focus,
select:focus{
    border-color:#d94c7c;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:18px;
    font-family:inherit;
}

.create-btn{
    color:white;
    background:linear-gradient(135deg,#c92862,#ed7544);
    box-shadow:0 8px 22px rgba(200,40,98,.25);
}

.create-btn:active,
.share-btn:active,
.new-btn:active{
    transform:scale(.98);
}

/* Wish Area */

.result{
    display:none;
    margin-top:28px;
}

/* Beautiful Frame */

.wish-frame{
    position:relative;
    padding:12px;
    border-radius:25px;
    background:linear-gradient(135deg,#d6a33b,#fff0a7,#c88a20,#fff0a7,#d6a33b);
    box-shadow:
        0 15px 45px rgba(100,30,50,.22),
        inset 0 0 0 2px rgba(255,255,255,.7);
}

.wish-inner{
    position:relative;
    padding:30px 20px;
    border-radius:17px;
    background:
        radial-gradient(circle at center,rgba(255,244,200,.8),transparent 50%),
        #fffdf3;
    border:3px solid #a87520;
    overflow:hidden;
}

/* Decorative corners */

.corner{
    position:absolute;
    font-size:30px;
}

.c1{
    top:8px;
    left:10px;
}

.c2{
    top:8px;
    right:10px;
}

.c3{
    bottom:8px;
    left:10px;
}

.c4{
    bottom:8px;
    right:10px;
}

.frame-top{
    font-size:16px;
    color:#9a6513;
    font-weight:bold;
    letter-spacing:1px;
}

.frame-title{
    font-size:32px;
    margin:12px 0;
    color:#a51f50;
}

.receiver{
    font-size:25px;
    font-weight:bold;
    color:#7b1b43;
    margin:15px 0;
}

.wish-text{
    white-space:pre-line;
    font-size:18px;
    line-height:1.9;
    color:#5d3042;
    min-height:170px;
}

.signature{
    margin-top:18px;
    font-size:17px;
    color:#8c3d5c;
    font-weight:bold;
}

.frame-bottom{
    margin-top:20px;
    font-size:26px;
}

/* Buttons */

.share-btn{
    background:#25D366;
    color:white;
}

.copy-btn{
    background:#5b4bc4;
    color:white;
}

.new-btn{
    background:linear-gradient(135deg,#e4a22b,#f2c95b);
    color:#572d00;
}

.footer{
    margin-top:30px;
    font-size:13px;
    color:#89556b;
    line-height:1.6;
}

/* Mobile */

@media(max-width:500px){

    h1{
        font-size:34px;
    }

    .rakhi-icon{
        font-size:65px;
    }

    .subtitle{
        font-size:15px;
    }

    .frame-title{
        font-size:27px;
    }

    .receiver{
        font-size:22px;
    }

    .wish-text{
        font-size:16px;
        line-height:1.8;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="badge">
        🎀 भाई-बहन के खूबसूरत रिश्ते के नाम 🎀
    </div>

    <div class="rakhi-icon">
        🪢
    </div>

    <h1>शुभ रक्षाबंधन ❤️</h1>

    <p class="subtitle">
        अपने प्यारे भाई या बहन के लिए<br>
        एक खूबसूरत रक्षाबंधन शुभकामना बनाइए ✨
    </p>


    <!-- INPUT -->

    <div class="input-card">

        <label>आपका नाम</label>

        <input
            id="yourName"
            type="text"
            placeholder="अपना नाम लिखें"
        >


        <label>भाई / बहन का नाम</label>

        <input
            id="otherName"
            type="text"
            placeholder="भाई या बहन का नाम लिखें"
        >


        <label>रिश्ता चुनें</label>

        <select id="relation">

            <option value="Brother">
                भाई ❤️
            </option>

            <option value="Sister">
                बहन ❤️
            </option>

        </select>


        <button
            class="create-btn"
            onclick="createWish()"
        >
            ✨ शुभकामना बनाएं
        </button>

    </div>


    <!-- RESULT -->

    <div
        class="result"
        id="result"
    >

        <div class="wish-frame">

            <div class="wish-inner">

                <div class="corner c1">🌸</div>
                <div class="corner c2">🌸</div>
                <div class="corner c3">🌺</div>
                <div class="corner c4">🌺</div>


                <div class="frame-top">
                    🪔 शुभ रक्षाबंधन 🪔
                </div>


                <div class="frame-title">
                    🎀 राखी की शुभकामनाएं 🎀
                </div>


                <div
                    class="receiver"
                    id="receiver"
                >
                </div>


                <div
                    class="wish-text"
                    id="wishText"
                >
                </div>


                <div
                    class="signature"
                    id="signature"
                >
                </div>


                <div class="frame-bottom">
                    🌸 🪢 🌸
                </div>

            </div>

        </div>


        <button
            class="share-btn"
            onclick="shareWhatsApp()"
        >
            📲 WhatsApp पर शेयर करें
        </button>


        <button
            class="new-btn"
            onclick="newWish()"
        >
            🔄 नई शुभकामना बनाएं
        </button>


        <button
            class="copy-btn"
            onclick="copyWish()"
        >
            📋 शुभकामना कॉपी करें
        </button>

    </div>


    <div class="footer">

        इस रक्षाबंधन अपने भाई या बहन को<br>
        प्यार और शुभकामनाओं से याद करें ❤️

        <br><br>

        Made with ❤️ for Raksha Bandhan

    </div>

</div>


<script>

/* =========================
   HINDI WISHES
========================= */

const brotherWishes = [

`भाई, रक्षाबंधन के इस खूबसूरत त्योहार पर
बस यही दुआ है कि तुम्हारी जिंदगी
हमेशा खुशियों से भरी रहे।

तुम हमेशा मुस्कुराते रहो,
सफलता तुम्हारे हर कदम को चूमे
और हमारा रिश्ता हमेशा ऐसा ही प्यारा बना रहे। ❤️`,

`प्यारे भाई,
बचपन की शरारतों से लेकर आज तक,
हमारा रिश्ता हमेशा खास रहा है।

इस रक्षाबंधन पर ईश्वर से यही प्रार्थना है
कि तुम्हें जिंदगी की हर खुशी मिले
और तुम्हारे सभी सपने पूरे हों। 🎀❤️`,

`भाई-बहन का रिश्ता दुनिया का
सबसे प्यारा रिश्ता होता है।

तुम हमेशा खुश रहो,
स्वस्थ रहो और जीवन में खूब तरक्की करो।

रक्षाबंधन की ढेर सारी शुभकामनाएं भाई! 🌸❤️`,

`कभी लड़ाई,
कभी मजाक,
कभी प्यार और कभी नाराजगी...

इन्हीं छोटी-छोटी यादों से
हमारा रिश्ता इतना खूबसूरत बना है।

मेरे प्यारे भाई को
रक्षाबंधन की बहुत-बहुत शुभकामनाएं! 🪢❤️`,

`इस राखी पर तुम्हारी कलाई पर
सिर्फ एक धागा नहीं,
बल्कि मेरी ढेर सारी शुभकामनाएं बंधी हैं।

हमेशा खुश रहो भाई,
और जिंदगी में खूब आगे बढ़ो।

शुभ रक्षाबंधन! ❤️`
];


const sisterWishes = [

`प्यारी बहन,
रक्षाबंधन के इस खास दिन पर
ईश्वर से यही प्रार्थना है कि
तुम्हारी जिंदगी हमेशा खुशियों से भरी रहे।

तुम्हारी हर इच्छा पूरी हो
और तुम्हारे चेहरे की मुस्कान
हमेशा बनी रहे। ❤️`,

`बहन,
तुम सिर्फ मेरी बहन नहीं,
मेरी जिंदगी की एक बहुत खास दोस्त भी हो।

तुम्हारे साथ बिताया हर पल
मेरे लिए बहुत कीमती है।

रक्षाबंधन की ढेर सारी शुभकामनाएं! 🌸❤️`,

`हमारी छोटी-छोटी लड़ाइयां,
मस्ती और ढेर सारी यादें...

यही तो हमारे रिश्ते को खास बनाती हैं।

मेरी प्यारी बहन को
रक्षाबंधन की बहुत सारी शुभकामनाएं! 🎀`,

`इस रक्षाबंधन पर मेरी यही दुआ है
कि तुम्हारे जीवन में कभी खुशियों की कमी न हो।

तुम हमेशा मुस्कुराती रहो
और अपने हर सपने को पूरा करो।

शुभ रक्षाबंधन बहन! ❤️`,

`रिश्ते बहुत होते हैं जिंदगी में,
लेकिन भाई-बहन का रिश्ता
अपने आप में सबसे अनमोल होता है।

मेरी प्यारी बहन को
रक्षाबंधन की ढेर सारी शुभकामनाएं। 🪢🌸`
];


/* =========================
   VARIABLES
========================= */

let currentWish = "";

let lastIndex = -1;


/* =========================
   CREATE WISH
========================= */

function createWish(){

    const yourName =
        document.getElementById("yourName")
        .value.trim();

    const otherName =
        document.getElementById("otherName")
        .value.trim();

    const relation =
        document.getElementById("relation")
        .value;


    if(yourName === "" || otherName === ""){

        alert("कृपया दोनों नाम लिखें ❤️");

        return;
    }


    showRandomWish(
        yourName,
        otherName,
        relation
    );
}


/* =========================
   RANDOM WISH
========================= */

function showRandomWish(
    yourName,
    otherName,
    relation
){

    let wishes =
        relation === "Brother"
        ? brotherWishes
        : sisterWishes;


    let index;


    do{

        index =
            Math.floor(
                Math.random() * wishes.length
            );

    }

    while(
        wishes.length > 1 &&
        index === lastIndex
    );


    lastIndex = index;


    currentWish = wishes[index];


    document.getElementById("receiver")
        .innerText =
        `प्रिय ${otherName} ❤️`;


    document.getElementById("wishText")
        .innerText =
        currentWish;


    document.getElementById("signature")
        .innerText =
        `प्यार सहित — ${yourName} ❤️`;


    document.getElementById("result")
        .style.display =
        "block";


    document.getElementById("result")
        .scrollIntoView({
            behavior:"smooth"
        });


    createFloating();
}


/* =========================
   NEW WISH
========================= */

function newWish(){

    const yourName =
        document.getElementById("yourName")
        .value.trim();

    const otherName =
        document.getElementById("otherName")
        .value.trim();

    const relation =
        document.getElementById("relation")
        .value;


    if(
        yourName === "" ||
        otherName === ""
    ){

        alert("पहले नाम लिखें ❤️");

        return;
    }


    showRandomWish(
        yourName,
        otherName,
        relation
    );
}


/* =========================
   WHATSAPP
========================= */

function shareWhatsApp(){

    const yourName =
        document.getElementById("yourName")
        .value.trim();

    const otherName =
        document.getElementById("otherName")
        .value.trim();


    const text =

`🎀 शुभ रक्षाबंधन 🎀

प्रिय ${otherName} ❤️

${currentWish}

प्यार सहित —
${yourName} ❤️

✨ अपनी Rakhi Wish बनाएं ✨`;


    const whatsappURL =
        "https://wa.me/?text=" +
        encodeURIComponent(text);


    window.open(
        whatsappURL,
        "_blank"
    );
}


/* =========================
   COPY
========================= */

function copyWish(){

    const yourName =
        document.getElementById("yourName")
        .value.trim();

    const otherName =
        document.getElementById("otherName")
        .value.trim();


    const text =

`🎀 शुभ रक्षाबंधन 🎀

प्रिय ${otherName} ❤️

${currentWish}

प्यार सहित —
${yourName} ❤️`;


    navigator.clipboard
        .writeText(text)
        .then(function(){

            alert(
                "शुभकामना कॉपी हो गई ❤️"
            );

        })
        .catch(function(){

            alert(
                "Copy नहीं हो पाया।"
            );

        });
}


/* =========================
   FLOATING EFFECT
========================= */

function createFloating(){

    const symbols = [
        "❤️",
        "💖",
        "🌸",
        "🌺",
        "✨",
        "🎀"
    ];


    for(
        let i = 0;
        i < 18;
        i++
    ){

        const element =
            document.createElement("div");


        element.className =
            "floating";


        element.innerText =
            symbols[
                Math.floor(
                    Math.random()
                    * symbols.length
                )
            ];


        element.style.left =
            Math.random() * 100 + "vw";


        element.style.animationDuration =
            (4 + Math.random() * 4)
            + "s";


        element.style.fontSize =
            (18 + Math.random() * 18)
            + "px";


        document.body.appendChild(
            element
        );


        setTimeout(
            function(){

                element.remove();

            },
            8500
        );
    }
}

</script>

</body>
</html>
